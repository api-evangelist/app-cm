name: App-CM
description: 'App-CM, Inc. (株式会社アップシーエム) is a Tokyo-based technology company that
  operates a proprietary video-advertising delivery platform for smartphones, using in-house
  compression, delivery, and targeting-algorithm technology to serve video ads smoothly in
  mobile environments. App-CM also develops and publishes consumer mobile apps including
  FriendQuiz, SunQ, and Shakin. The company is backed by 500 Global and is profiled in the
  API Evangelist network. It ships a publisher-side iOS/Android video ad SDK, but distributes
  it only through a sales conversation: there is no public API, developer portal, SDK download,
  package-registry release, or machine-readable specification, and every /.well-known/ discovery
  path returns 404. This profile captures its identity, commercial model, and security posture.'
